<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#3a1706">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu Energy · สูตรเครื่องชงกาแฟ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kdam+Thmor+Pro&family=Saira+Extra+Condensed:wght@700;800&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8ecc9;--ink:#1a0d06;--card:#fffaf0;--line:#1a0d06;--muted:#6d5646;--hot:#ff4a1c;--green:#1f9d55}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f120a;--ink:#fff3dc;--card:#2d1b10;--line:#000;--muted:#c4a98f}}
:root[data-theme="dark"]{--bg:#1f120a;--ink:#fff3dc;--card:#2d1b10;--line:#000;--muted:#c4a98f}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 'Prompt','Noto Sans Thai',system-ui,sans-serif;min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
.wrap{padding:6px 14px 28px}
.disp{font-family:'Saira Extra Condensed','Prompt',system-ui,sans-serif;font-weight:800;letter-spacing:.2px}
.ttl{font-family:'Kdam Thmor Pro','Prompt',system-ui,sans-serif;font-weight:400}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#app{max-width:480px;min-height:100vh;min-height:100dvh;margin:0 auto;background:var(--bg)}
@media (min-width:520px){body{background:#1a0d06}#app{box-shadow:0 0 0 1px rgba(255,255,255,.08),0 24px 60px rgba(0,0,0,.5)}}
/* cover */
.hero{position:relative;overflow:hidden;text-align:center;color:#fff;padding:calc(env(safe-area-inset-top,0px) + 16px) 14px 0;background:radial-gradient(75% 85% at 50% 40%,rgba(255,132,44,.6),transparent 72%),linear-gradient(165deg,#5a210a,#1f0d04 82%)}
.hero::after{content:"";position:absolute;left:-8%;right:-8%;bottom:-1px;height:30px;background:var(--bg);border-radius:50% 50% 0 0/100% 100% 0 0}
.pat{position:absolute;inset:-45% -25%;transform:rotate(-18deg);display:flex;flex-direction:column;justify-content:center;pointer-events:none;user-select:none}
.pat span{white-space:nowrap;font-size:30px;line-height:1.3;color:transparent;-webkit-text-stroke:1px rgba(255,176,96,.2)}
.pat span:nth-child(even){margin-left:-90px}
.hero h1{position:relative;margin:4px 0 0;font-size:clamp(40px,12.5vw,56px);line-height:1;color:#ffc233;transform:rotate(-6deg);text-shadow:1px 1px 0 #ff4a1c,2px 2px 0 #ff4a1c,3px 3px 0 #e03a10,4px 4px 0 #c42f0b,5px 5px 0 #8a1f06,6px 6px 0 #5a1304,7px 7px 0 #1a0d06,8px 12px 18px rgba(0,0,0,.55)}
.hero p{position:relative;margin:12px 0 0;font-size:14px;font-weight:500;color:#f6d9b8}
.line{position:relative;z-index:2;display:flex;justify-content:center;align-items:flex-end;height:calc(110*min(1px,.2778vw));margin-top:2px}
.line img{display:block;width:calc(var(--h)*min(1px,.2778vw));height:auto;margin:0 -12px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.45))}
/* menu grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;display:block;aspect-ratio:1191/1685;padding:0;border:0;border-radius:18px;overflow:hidden;color:#fff;text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -50px 50px -30px rgba(0,0,0,.35),0 4px 0 rgba(0,0,0,.4),0 10px 16px -6px rgba(0,0,0,.4);transition:transform .12s,box-shadow .12s}
.tile::before{content:"";position:absolute;inset:0;background:radial-gradient(110% 55% at 50% 0,rgba(255,255,255,.3),transparent 65%)}
.tile:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -50px 50px -30px rgba(0,0,0,.35),0 1px 0 rgba(0,0,0,.4)}
.tile[aria-disabled="true"]{filter:saturate(.5) brightness(.8);cursor:default}
.soon{position:absolute;top:8px;right:8px;z-index:3;background:#000;color:#fff;font-size:11px;padding:2px 8px;border-radius:99px}
.sub{position:absolute;left:8px;right:8px;bottom:8px;z-index:2;font-size:12px;line-height:1.25;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.foot{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 8px;margin:22px 0 0;font-size:12.5px;color:var(--muted)}
.foot span{padding:4px 12px;border:1.5px solid color-mix(in srgb,var(--ink) 25%,transparent);border-radius:99px}
/* drink stage (title + glass) */
.stage{position:absolute;inset:0;display:block}
.ly{position:absolute;display:block;max-width:none;height:auto;pointer-events:none}
.ly.e{opacity:.55;-webkit-mask-image:linear-gradient(to bottom,transparent 22%,#000 26%,rgba(0,0,0,.4) 100%);mask-image:linear-gradient(to bottom,transparent 22%,#000 26%,rgba(0,0,0,.4) 100%)}
.ly.g{filter:drop-shadow(0 5px 5px rgba(0,0,0,.3))}
/* recipe page */
.dwrap{display:block}
.top{position:relative;overflow:hidden;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 16px;border-radius:0 0 24px 24px;box-shadow:inset 0 -24px 40px -20px rgba(0,0,0,.35),0 8px 18px -8px rgba(0,0,0,.4)}
.top::before{content:"";position:absolute;inset:0;background:radial-gradient(80% 60% at 50% 30%,rgba(255,255,255,.28),transparent 70%)}
.back{position:relative;z-index:3;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border:0;border-radius:99px;background:rgba(0,0,0,.4);color:#fff;font-weight:600}
.stage.hs{position:relative;inset:auto;width:min(56%,184px);aspect-ratio:477/560;margin:-40px auto 0}
.body{padding:14px 14px 12px}
.panel{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 12px;padding:10px 12px;background:var(--card);border:2px solid var(--line);border-radius:18px;box-shadow:0 3px 0 var(--line)}
.panel b{font-size:15px}
.step{display:flex;align-items:center;border:2px solid var(--line);border-radius:99px;background:var(--bg);overflow:hidden}
.step button{width:46px;height:44px;border:0;background:transparent;font-size:24px;font-weight:600}
.step button:disabled{opacity:.3}
.step output{min-width:40px;text-align:center;font-size:28px;line-height:1}
.sw{display:flex;align-items:center;gap:10px;flex:1 1 170px;min-height:44px;padding:4px 12px;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:14px}
.sw i{flex:none;width:42px;height:26px;border-radius:99px;background:#9a8a7c;position:relative;transition:background .15s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked="true"] i{background:var(--green)}
.sw[aria-checked="true"] i::after{transform:translateX(16px)}
.sw span{flex:1;font-weight:500;line-height:1.2}
.sw small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.lh{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 6px;font-weight:600}
.reset{min-height:44px;padding:0 4px;border:0;background:transparent;color:var(--muted);font-size:13px;text-decoration:underline}
.ings{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.ing{display:grid;grid-template-columns:40px 1fr auto 26px;align-items:center;gap:12px;width:100%;min-height:58px;padding:8px 12px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;box-shadow:0 3px 0 var(--line);transition:background .15s,transform .1s,box-shadow .1s}
.ing:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.ic{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;font-size:22px;background:color-mix(in srgb,var(--c1) 24%,var(--card))}
.lb{font-weight:600;line-height:1.2}
.lb small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.g{font-size:30px;line-height:1}
.g small{margin-left:2px;font:400 13px 'Prompt',sans-serif;color:var(--muted)}
.ice .g{font-size:20px}
.ck{display:grid;place-items:center;width:26px;height:26px;border:2px solid var(--line);border-radius:50%;color:transparent;font-size:14px;font-weight:700}
.ing.done{background:color-mix(in srgb,var(--green) 22%,var(--card))}
.ing.done .lb,.ing.done .g{text-decoration:line-through;text-decoration-thickness:2px}
.ing.done .ck{background:var(--green);border-color:var(--green);color:#fff}
.sum{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding:10px 14px;color:#fff;background:var(--c2);border-radius:16px;box-shadow:0 0 0 2px var(--line),0 8px 18px -4px rgba(0,0,0,.5);transition:background .2s}
.sum.ok{background:var(--green)}
.sl small{display:block;font-size:12px;opacity:.85}
.sl b{font-size:30px;line-height:1}
.sr{text-align:right;font-size:14px;font-weight:600}
.bar{display:block;width:96px;height:6px;margin:6px 0 0 auto;border-radius:9px;background:rgba(255,255,255,.28);overflow:hidden}
.bar u{display:block;height:100%;background:#fff;border-radius:9px;transition:width .2s}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function rows(d){
  var r=d.ing.slice();
  if(d.sweet&&st.sweet)r.splice(r.length-1,0,d.sweet);
  return r;
}
function paint(d){
  var r=rows(d),tot=0,n=r.length,left=0,h='';
  r.forEach(function(x){
    var k=x[1],ice=x[2]===undefined,done=!!st.done[k];
    if(!ice&&!x[4])tot+=x[2]*st.cups;
    if(done)left++;
    h+='<li><button class="ing'+(done?' done':'')+(ice?' ice':'')+'" data-k="'+k+'" role="checkbox" aria-checked="'+done+'"><span class="ic" aria-hidden="true">'+x[0]+'</span><span class="lb">'+k+(ice?'<small>ใส่น้ำแข็งตามมาตรฐานร้าน</small>':x[3]?'<small>'+x[3]+'</small>':'')+'</span>'+
    '<span class="g disp">'+(ice?'Ice':fmt(x[2]*st.cups)+'<small>g</small>')+'</span><span class="ck" aria-hidden="true">✓</span></button></li>';
  });
  document.getElementById('list').innerHTML=h;
  document.getElementById('cups').textContent=st.cups;
  document.getElementById('m').disabled=st.cups<=1;
  document.getElementById('p').disabled=st.cups>=10;
  var ok=left===n,s=document.getElementById('sum');
  s.className='sum'+(ok?' ok':'');
  s.innerHTML='<div class="sl"><small>น้ำหนักในแก้ว (ไม่รวมน้ำแข็ง)</small><b class="disp">'+fmt(tot)+' g</b></div><div class="sr"><span>'+(ok?'ครบแล้ว พร้อมเสิร์ฟ ✓':'ชั่งแล้ว '+left+' / '+n)+'</span><i class="bar"><u style="width:'+(left/n*100)+'%"></u></i></div>';
  var sw=document.getElementById('sw');if(sw)sw.setAttribute('aria-checked',st.sweet);
}
function route(){
  var id=(location.hash||'').replace(/^#\/?/,'');
  var d=DRINKS.filter(function(x){return x.id===id&&!x.soon})[0];
  st={cups:1,sweet:false,done:{}};
  if(d)detail(d);else home();
}
app.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  var id=location.hash.replace(/^#\/?/,'');
  var d=DRINKS.filter(function(x){return x.id===id})[0];
  if(t.classList.contains('tile')){if(t.getAttribute('aria-disabled')!=='true')location.hash='#/'+t.dataset.id;return}
  if(t.id==='back'){location.hash='#/';return}
  if(!d)return;
  if(t.id==='m'&&st.cups>1)st.cups--;
  else if(t.id==='p'&&st.cups<10)st.cups++;
  else if(t.id==='sw')st.sweet=!st.sweet;
  else if(t.id==='reset')st.done={};
  else if(t.classList.contains('ing'))st.done[t.dataset.k]=!st.done[t.dataset.k];
  paint(d);
});
window.addEventListener('hashchange',route);
route();
</script>
</body>
</html>
